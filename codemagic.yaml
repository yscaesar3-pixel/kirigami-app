workflows:
  ios-workflow:
    name: きりがみ iOS ビルド
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: kirigami_asc_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yutaXXX.kirigami
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.yutaXXX.kirigami"
      node: latest
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Install npm dependencies
        script: |
          npm install

      - name: Capacitor sync
        script: |
          npx cap sync ios

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all $PROJECT_BUILD_NUMBER

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups: []
